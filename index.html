<script>
  // Lazy load Iubenda after user interaction
  let iubendaLoaded = false;
  
  function loadIubenda() {
    if (iubendaLoaded) return;
    iubendaLoaded = true;
    
    // FIRST: Set the configuration
    window._iub = window._iub || [];
    window._iub.csConfiguration = {
      "siteId": 3976504,
      "cookiePolicyId": 46320706,
      "lang": "it",
      "storage": {
        "useSiteId": true
      }
    };
    
    // THEN: Load the scripts in correct order
    // Load autoblocking script first
    const script1 = document.createElement('script');
    script1.src = 'https://cs.iubenda.com/autoblocking/3976504.js';
    script1.async = true;
    document.head.appendChild(script1);
    
    // Load CS script second
    const script2 = document.createElement('script');
    script2.src = 'https://cdn.iubenda.com/cs/iubenda_cs.js';
    script2.charset = 'UTF-8';
    script2.async = true;
    document.head.appendChild(script2);
  }
  
  // Load Iubenda after 3 seconds or on first interaction
  const interactions = ['mousedown', 'keydown', 'touchstart', 'scroll'];
  
  function triggerLoad() {
    loadIubenda();
    // Remove all listeners after loading
    interactions.forEach(event => {
      document.removeEventListener(event, triggerLoad, { passive: true });
    });
  }
  
  // Add interaction listeners
  interactions.forEach(event => {
    document.addEventListener(event, triggerLoad, { passive: true });
  });
  
  // Also load after 3 seconds if no interaction
  setTimeout(loadIubenda, 3000);
</script>

        (function() {
            // Function to update links
            function updateLinks(gclid) {
                const links = document.querySelectorAll('a[href]');
                links.forEach(link => {
                    if (link.href.includes('gclidxyz')) {
                        link.href = link.href.replace('gclidxyz', gclid);
                    }
                });
            }

            // Get the URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const gclid = urlParams.get('gclid');
            
            // If gclid is present, observe changes to the body element
            if (gclid) {
                const body = document.body;
                if (body) {
                    // Create a MutationObserver to detect changes
                    const observer = new MutationObserver(() => {
                        updateLinks(gclid); // Update links when changes are detected
                    });

                    // Start observing the body element for child additions and modifications
                    observer.observe(body, { childList: true, subtree: true });

                    // Initial check in case links already exist
                    updateLinks(gclid);
                }
            }
        })();
    </script>
