        (function() {
            // Function to update links
            function updateLinks(gclid) {
                const links = document.querySelectorAll('a[href]');
                links.forEach(link => {
                    if (link.href.includes('gclidxyz')) {
                        link.href = link.href.replace('gclidxyz', gclid);
                    }
                });
            }

            // Get the URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const gclid = urlParams.get('gclid');
            
            // If gclid is present, observe changes to the body element
            if (gclid) {
                const body = document.body;
                if (body) {
                    // Create a MutationObserver to detect changes
                    const observer = new MutationObserver(() => {
                        updateLinks(gclid); // Update links when changes are detected
                    });

                    // Start observing the body element for child additions and modifications
                    observer.observe(body, { childList: true, subtree: true });

                    // Initial check in case links already exist
                    updateLinks(gclid);
                }
            }
        })();
    </script>
